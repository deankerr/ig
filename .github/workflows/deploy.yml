name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy or destroy
        required: false
        type: string
      destroy:
        description: Destroy the selected PR preview stage
        default: false
        required: false
        type: boolean

# Keep PR cleanup grouped by PR number even after merge, when github.ref becomes main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || inputs.stage || github.ref }}
  cancel-in-progress: ${{ !((github.event_name == 'pull_request' && github.event.action == 'closed') || (github.event_name == 'workflow_dispatch' && inputs.destroy)) }}

jobs:
  check:
    if: github.event.action != 'closed' && !inputs.destroy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check:ci

  deploy:
    if: github.event.action != 'closed' && !inputs.destroy
    runs-on: ubuntu-latest
    env:
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine stage
        id: stage
        env:
          INPUT_STAGE: ${{ inputs.stage }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "stage=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          elif [[ -n "$INPUT_STAGE" ]]; then
            if [[ ! "$INPUT_STAGE" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]]; then
              echo "ERROR: Invalid stage: $INPUT_STAGE"
              exit 1
            fi

            echo "stage=$INPUT_STAGE" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "stage=prod-2" >> $GITHUB_OUTPUT
          else
            echo "stage=${GITHUB_REF_NAME//\//-}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy
        run: bun run deploy
        env:
          ALCHEMY_STAGE: ${{ steps.stage.outputs.stage }}
          RUNWARE_KEY: ${{ secrets.RUNWARE_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_ALLOWED_CHANNEL_IDS: ${{ secrets.DISCORD_ALLOWED_CHANNEL_IDS }}
          DISCORD_MODEL_ALLOWLIST: ${{ secrets.DISCORD_MODEL_ALLOWLIST }}
          VITE_BUILD_ID: ${{ github.sha }}
        timeout-minutes: 10

  cleanup:
    if: (github.event_name == 'pull_request' && github.event.action == 'closed') || (github.event_name == 'workflow_dispatch' && inputs.destroy)
    runs-on: ubuntu-latest
    env:
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine stage
        id: stage
        env:
          INPUT_STAGE: ${{ inputs.stage }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            STAGE="pr-${{ github.event.pull_request.number }}"
          else
            STAGE="$INPUT_STAGE"
          fi

          if [[ ! "$STAGE" =~ ^pr-[0-9]+$ ]]; then
            echo "ERROR: Refusing to destroy non-preview stage: $STAGE"
            exit 1
          fi

          echo "stage=$STAGE" >> $GITHUB_OUTPUT

      - name: Destroy preview environment
        run: bun run destroy
        env:
          ALCHEMY_STAGE: ${{ steps.stage.outputs.stage }}
